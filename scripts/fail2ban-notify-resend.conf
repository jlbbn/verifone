# /etc/fail2ban/action.d/notify-resend.conf
# Acción fail2ban: envía alerta por email vía Resend API cuando una IP es baneada.
# Requiere: /usr/local/bin/fail2ban-notify-resend.py + /etc/fail2ban/resend.env

[Definition]

# Ejecutar el notificador al banear una IP
actionban = /usr/local/bin/fail2ban-notify-resend.py <ip> <failures> <name>

# No hace nada al desbanear
actionunban =

[Init]
# No hay parámetros de inicialización requeridos
